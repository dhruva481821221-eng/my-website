<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f8;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #eb902f;
            color: white;
            padding: 54px;
            text-align: center;
            font-family:cursive;
            font-weight: bolder;
            font-size:24PX;
        }

        .card {
            width: 280px;
            margin: 24px auto;
            background: white;
            border: 2px solid #abed12;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #8fdc11;
            color: white;
            font-size: 36px;
            line-height: 90px;
            margin: 0 auto 10px;
        }

        .bio {
            height: 80px;
            overflow: auto;
            text-align: left;
            border: 5px solid rgb(108, 243, 11);
            padding: 8px;
            margin-top: 12px;
            font-size: 14px;
            font-family: cursive;
        }

        .fab {
            position:fixed;
            left: 16px;
            bottom: 16px;
            width: 52px;
            height: 52px;
            border: 0;
            border-radius:70%;
            background: #ffb703;
            font-size: 26px;
        }

        p{ 
            font-family: monospace;
        }

        h2{
            font-family: fantasy;
        }
    </style>
</head>

<body>
    <header>MY PROFILE CARD</header>
    <div class="card">
        <div class="avatar" >Dex</div>
        <h2>Dhruv Sharma</h2>
        <p>Web Developer </p>
        <div class="bio">
            Hi! I am Dexen. I started coding this year. I like making small websites,
            drawing and listening to music. My goal is to build my own app. This long
            text is here so that the box shows a scroll bar. Try scrolling it!
        </div>
    </div>
    <button class="fab">=</button>
</body>

</html>
